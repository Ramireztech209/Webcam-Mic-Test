<!DOCTYPE html>
<html>
<head>
    <title>Webcam, Microphone, and Trackpad Test</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0; /* Light gray background */
        }

        #video {
            width: 640px;
            height: 480px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
        }

        #status {
            margin-top: 10px;
            font-weight: bold;
        }

        button {
            padding: 10px 20px;
            background-color: #4CAF50; /* Green */
            border: none;
            color: white;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 5px; /* Rounded corners */
        }

        button:hover {
            background-color: #45a049; /* Darker green on hover */
        }

        #visualizer {
            width: 640px;
            height: 100px;
            background-color: #000;
        }

        #trackpad-area {
            width: 640px;
            height: 480px;
            border: 1px solid #ccc;
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            position: relative;
        }

        .sector {
            width: 25%; /* Divide into 4x4 grid */
            height: 25%;
            box-sizing: border-box;
            border: 1px solid #ddd;
        }

        .sector.highlight {
            background-color: rgba(0, 255, 0, 0.5); /* Highlight in green */
        }

        #trackpad-status {
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>Webcam, Microphone, and Trackpad Test</h1>

    <video id="video" autoplay playsinline></video>
    <canvas id="visualizer"></canvas>
    <div id="status" aria-live="polite">Initializing...</div>
    <button id="start-button">Start Test</button>
    <button id="stop-button" style="display:none;">Stop Test</button>
    <button id="speaker-test-button">Speaker Test</button>

    <h2>Trackpad Test</h2>
    <div id="trackpad-area">
        <!-- Sectors will be dynamically added here -->
    </div>
    <div id="trackpad-status"></div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');
        const startButton = document.getElementById('start-button');
        const stopButton = document.getElementById('stop-button');
        const speakerTestButton = document.getElementById('speaker-test-button');
        const trackpadArea = document.getElementById('trackpad-area');
        const trackpadStatus = document.getElementById('trackpad-status');
        let stream;
        let audioContext;
        let microphone;
        let analyzer;

        // Webcam and Microphone Test Code
        async function startTest() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                video.srcObject = stream;

                // Set up Microphone Visualizer
                audioContext = new AudioContext();
                microphone = audioContext.createMediaStreamSource(stream);
                analyzer = audioContext.createAnalyser();
                microphone.connect(analyzer);
                analyzer.fftSize = 256;

                const bufferLength = analyzer.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                function drawVisualizer() {
                    requestAnimationFrame(drawVisualizer);

                    analyzer.getByteFrequencyData(dataArray);

                    canvasCtx.fillStyle = 'black';
                    canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

                    const barWidth = (canvas.width / bufferLength) * 2.5;
                    let barHeight;
                    let x = 0;

                    for (let i = 0; i < bufferLength; i++) {
                        barHeight = dataArray[i];

                        canvasCtx.fillStyle = `rgb(${barHeight + 100},50,50)`;
                        canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);

                        x += barWidth + 1;
                    }
                }

                drawVisualizer();

                statusDiv.textContent = 'Webcam and Microphone are active.';
                startButton.style.display = 'none';
                stopButton.style.display = 'inline-block';
            } catch (error) {
                statusDiv.textContent = `Error: ${error.message}`;
            }
        }

        function stopTest() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            if (audioContext) {
                audioContext.close();
            }
            statusDiv.textContent = 'Test stopped.';
            startButton.style.display = 'inline-block';
            stopButton.style.display = 'none';
        }

        // Speaker Test Code
        speakerTestButton.addEventListener('click', () => {
            const audio = new Audio('https://www.soundjay.com/button/beep-07.wav');
            audio.play();
        });

        // Trackpad Test Code
        function initializeTrackpadTest() {
            for (let i = 0; i < 16; i++) {
                const sector = document.createElement('div');
                sector.classList.add('sector');
                trackpadArea.appendChild(sector);
            }

            const sectors = document.querySelectorAll('.sector');

            trackpadArea.addEventListener('mousemove', (event) => {
                const rect = trackpadArea.getBoundingClientRect();
                const x = event.clientX - rect.left;
                const y = event.clientY - rect.top;

                sectors.forEach((sector) => {
                    const sectorRect = sector.getBoundingClientRect();
                    if (
                        event.clientX >= sectorRect.left &&
                        event.clientX <= sectorRect.right &&
                        event.clientY >= sectorRect.top &&
                        event.clientY <= sectorRect.bottom
                    ) {
                        sector.classList.add('highlight');
                    } else {
                        sector.classList.remove('highlight');
                    }
                });

                trackpadStatus.textContent = `Mouse moved: X = ${Math.round(x)}, Y = ${Math.round(y)}`;
            });

            trackpadArea.addEventListener('wheel', (event) => {
                const deltaX = event.deltaX;
                const deltaY = event.deltaY;
                trackpadStatus.textContent = `Scroll detected: DeltaX = ${deltaX}, DeltaY = ${deltaY}`;
            });

            trackpadArea.addEventListener('click', (event) => {
                trackpadStatus.textContent = `Click detected at X = ${event.clientX}, Y = ${event.clientY}`;
            });
        }

        startButton.addEventListener('click', startTest);
        stopButton.addEventListener('click', stopTest);

        initializeTrackpadTest();
    </script>

</body>
</html>
